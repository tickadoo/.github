name: Agent instructions

on:
  pull_request:
    paths:
      - '**/AGENTS.md'
      - '**/CLAUDE.md'
      - .github/workflows/agent-instructions.yml
  workflow_call:

permissions:
  contents: read

jobs:
  agent-instructions:
    name: agent-instructions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify one canonical instruction source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' claude_files < <(find . -name CLAUDE.md -type f -print0)
          test "${#claude_files[@]}" -gt 0 || { echo "No CLAUDE.md found"; exit 1; }
          for claude_file in "${claude_files[@]}"; do
            agent_file="$(dirname "$claude_file")/AGENTS.md"
            test -s "$agent_file" || { echo "$agent_file is missing or empty"; exit 1; }
            count=$(awk '$0 == "@AGENTS.md" { n++ } END { print n + 0 }' "$claude_file")
            test "$count" -eq 1 || { echo "$claude_file must contain exactly one literal @AGENTS.md line, found $count"; exit 1; }
          done