name: Agent instructions

on:
  pull_request:
    paths:
      - AGENTS.md
      - CLAUDE.md
      - .github/workflows/agent-instructions.yml
  workflow_call:

permissions:
  contents: read

jobs:
  agent-instructions:
    name: agent-instructions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Verify one canonical instruction source
        shell: bash
        run: |
          set -euo pipefail
          test -s AGENTS.md || { echo "AGENTS.md is missing or empty"; exit 1; }
          test -s CLAUDE.md || { echo "CLAUDE.md is missing or empty"; exit 1; }
          count=$(awk '$0 == "@AGENTS.md" { n++ } END { print n + 0 }' CLAUDE.md)
          test "$count" -eq 1 || { echo "CLAUDE.md must contain exactly one literal @AGENTS.md line, found $count"; exit 1; }